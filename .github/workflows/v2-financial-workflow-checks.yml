name: NMR V2 financial workflow checks

on:
  push:
    branches:
      - feat/v2-financial-workflow-hardening
  pull_request:
    branches:
      - feat/workplace-finance-v2

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Run full provider regression suite
        run: python -m pytest -q
        env:
          NMR_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
          NMR_ADMIN_PASSWORD: test-admin-password

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Build TypeScript and Vite
        run: npm run build
